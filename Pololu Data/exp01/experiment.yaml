problem: problems/pololu_gains.yaml
seed: 0
num_iterations: 5
use_residual_model: true
optimize_trajectories: true
use_standalone_gain_tuning_defaults: true
baseline_identification_trajectory: null
baseline_tuning_trajectories_dir: null
robotcfg_template: null
log_loading:
  clip_after_first_trajectory: true
mujoco_deployment:
  enabled: true
  num_logs: 5
  start_offset_radius: 0.1
  start_offset_angle: 0.3
identification_trajectory:
  opt_steps: 500
  learning_rate: 0.002
  num_control_points: 6
  time_scaling: s-curve
  window_length: 50
  fim_a_slip_max: false
  bridge_wait_time: 1.0
  bridge_time: 5.0
identification:
  steps: 500
  learning_rate: 0.0005
  window_length: null
  outlier_z_threshold: 3.5
  identify_a_slip_max: false
  init_a_slip_max: 5.0
residual:
  num_experts: 4
  hidden_sizes:
  - 16
  - 16
  spectral_norm_cap: 1.5
  gate_bandwidth_scale: 1.0
  ood_sigma: 3.0
  epochs: 500
  batch_size: 16384
  learning_rate: 0.0005
  validation_split: 0.2
  output_reg_weight: 0.01
  resample_uniform: true
  pool_previous_iterations: true
tuning_trajectories:
  num_trajectories: 10
  opt_steps: 50
  learning_rate: 0.03
  num_control_points: 6
  time_scaling: s-curve
  constraint_weight_jitter: 0.4
  window_length: 50
  kimotor_fim_scale: 1.0
gain_tuning:
  steps: 160
  learning_rate: 0.0003
  num_realizations: 4
  init_offset_radius: 0.1
  init_offset_angle: 0.3
  num_lhs_points: 0
  optimizer: bfgs
  num_adam_optimizations: 3
  validation_split: 0.2
  outlier_loss_factor: 20.0
  velocity_tracking_weight: 1.0
  input_weight: 0.0
  input_delta_weight: 1.0
  omega_delta_weight: 1.0
  gain_delta_weight: 0.0
  k_min_stab: 0.01
  k_max_stab: 50.0
  k_max_rest: 20.0
  gain_parametrization: null
  static_tune: true
  static_tune_steps: 160
  static_tune_learning_rate: 0.0003
  presearch_relative_range: 0.3
  warm_start_schedule: true
