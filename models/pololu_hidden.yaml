# Hidden ground truth of the MuJoCo plant that stands in for the robot.
#
# Only wmr_simulator.mujoco_sim reads this file; the pipeline and the firmware
# port get their parameters from ROBOTCFG.CFG / robot_config.yaml. The values
# here override models/pololu_calibrated.xml at load time. The effective
# rolling radius and wheelbase are emergent (contact penetration, tire scrub)
# and are measured by mujoco_sim.truth.

model_path: models/pololu_calibrated.xml

motor:
  # Velocity actuator: torque = kv * (duty * omega_max - qvel).
  omega_max: 230.0        # rad/s at duty = 1
  # 1.5x the datasheet stall torque of the 15:1 HPCB 6V gearmotor (0.0245 N-m);
  # at the datasheet value the robot cannot follow its own trajectories.
  stall_torque: 0.0368    # N-m at duty = 1, w = 0
  # Free wheel-speed rise, sets armature = kv * time_constant: total reflected
  # inertia (rotor through the gearbox plus the wheel) over kv.
  time_constant: 0.0263   # s

geometry:
  # From Pololu's drawing and STEP assembly (item 3725).
  wheel_radius: 0.016     # m
  # Half-length of the wheel collision cylinder, i.e. half the tire contact
  # width (MuJoCo models a cylinder on a plane as a line contact).
  wheel_width: 0.0015     # m
  wheel_mass: 0.0036      # kg
  half_track: 0.0421      # m, geometric wheelbase 0.0842

friction:
  # Tire on floor; chosen so that circle_fast at the stock gains is marginal,
  # as on the real robot. Traction limit mu * g = 6.9 m/s^2.
  floor: 0.70
  wheel: 0.70
  # Caster ball (POM) on PVC and the nose skid (ABS) on PVC, handbook values.
  caster: 0.35
  nose: 0.35

encoder:
  # Signed counts per wheel revolution (12 CPR motor * 15.25 gear), identical to
  # the firmware's encoder_cpr; counts = round(cpr * angle / 2pi).
  counts_per_revolution: -183.0

imu:
  site_pos: [0.0, 0.0, 0.006]     # body frame, on the control board
  site_euler: [0.0, 0.0, 0.0]     # chip axes aligned with the body axes
  accel_lsb_g: 6.1e-5             # LSM6DSO, 0.061 mg/LSB at +-2 g
  gyro_lsb_dps: 0.007             # LSM6DSO, 70 mdps/LSB at +-2000 dps
  accel_noise_g: 0.005
  gyro_noise_dps: 0.5
  accel_bias_g: [0.0, 0.0, 0.022]
  gyro_bias_dps: [0.0, 0.0, 0.0]

mocap:
  offset_xyz: [0.0, 0.0, 0.0]     # marker frame vs. the wheel-axle midpoint (robot frame)
  yaw_offset: 0.0                 # rad, mocap body yaw - robot yaw (pololu.mocap_calibration)
  position_noise_std: 0.0001      # m
  angle_noise_std: 0.001          # rad

# Seconds of zero-duty physics before a run, so the chassis settles onto the caster.
settle_time: 0.5
