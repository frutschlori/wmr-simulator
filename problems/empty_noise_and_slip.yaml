sim_time: 5.0 # seconds
geometry_controller_dt: 0.01 # seconds
wheel_controller_dt: 0.01 # seconds
environment:
  min: [-5, -5]
  max: [5, 5]
  obstacles: []
start: [0.0, 0.0, 0.0]
goal:  [2.0, 1.0, 1.57]
planner: 
  waypoints:
    - [0.5,0.0, -1.57]
    - [1.0,0.5, 1.57]
  time: 4.0 # seconds
controller:
  gains: [5.0, 5.0, 3.0, 0.4, 0.2] # [kx, ky, kth, kpmotor, kimotor]
noise_enabled: true # false zeroes the estimator measurement noise everywhere (sim, gain tuning, traj-opt FIM)
robot:
  type: differential_drive
  wheel_radius: 0.015  # m
  base_diameter: 0.09 # m, *effective* wheelbase (absorbs tire scrub in turns, Borenstein & Feng 1996; may differ from geometric)
  max_wheel_speed: 150 # rad/s
  time_constant:  0.0  # time constant for first-order wheel dynamics (set to 0 for ideal actuation)
  a_slip_max: 6.0     # traction limit ~ mu*g in m/s^2, 0 disables (burnout model, Wong 2008)
  v_max: 4.0
  a_max: 20.0
  omega_max: 4.0
  alpha_max: 20.0

estimator:
  type: "kf"              # estimator type: "kf" (Kalman Filter) or "dr" (Dead Reckoning)
  wheel_radius: 0.015     # estimator's wheel_radius [m]
  base_diameter: 0.09     # estimator's base_diameter [m]
  noise_pos: 0.02         # position measurement noise [m] (from mocap almost no noise)
  noise_angle: 0.07       # orientation noise [rad] ~  4 degrees
  enc_angle_noise: 0.01   # encoder noise
  wheel_lp_tau: 0.0       # [s] first-order low-pass on encoder wheel speeds fed to the controller (mirrors firmware; ~30 ms lag). 0 disables.

  proc_pos_std: 0.02      # [m]   process noise on x,y per step
  proc_theta_std: 0.05    # [rad] process noise on θ per step

  start: [0.0, 0.0, 0.0]  # initial pose estimate
