sim_time: 5.0 # seconds
geometry_controller_dt: 0.05 # seconds
wheel_controller_dt: 0.01 # seconds
environment:
  min: [-1.8, -2.5]
  max: [1.8, 2.5]
  obstacles: []
start: [-0.5, -1.0, 0.0]
goal:  [0.0, 1.0]
planner: 
  waypoints:
    - [0.5,0.0, -1.57]
    - [1.0,0.5, 1.57]
  time: 5.0 # seconds
controller:
  type: kanayama # kanayama (Kanayama tracking law) | dynamic_feedback (dynamic feedback linearization)
  # Motor gains are dimensionless here, but in duty / (rad/s) in pololu firmware -> divide gains by motor gain for conversion
  geometric_gains: [5.0, 5.0, 3.0] # [kx, ky, kth]
  motor_gains: [0.4, 0.2] # [kpmotor, kimotor]
  dynamic_feedback_gains: [10.0, 5.0, 12.0, 7.0] # [kp_x, kd_x, kp_y, kd_y], controller.type: dynamic_feedback only
noise_enabled: true # false zeroes the estimator measurement noise everywhere (sim, gain tuning, traj-opt FIM)
robot:
  type: differential_drive
  wheel_radius: 0.01637   # m
  base_diameter: 0.08525 # m, *effective* wheelbase (absorbs tire scrub in turns, Borenstein & Feng 1996; may differ from geometric)
  max_wheel_speed: 248.17  # rad/s
  time_constant:  0.2237  # time constant for first-order wheel dynamics (set to 0 for ideal actuation)
  a_slip_max: 6.0     # traction limit ~ mu*g in m/s^2, 0 disables (burnout model, Wong 2008)
  v_max: 2.0          # m/s
  a_max: 3.0         # m/s^2
  a_max_lateral: 10.0 # m/s^2
  omega_max: 5.0    # rad/s
  alpha_max: 10.0     # rad/s^2

estimator:
  type: "kf"              # estimator type: "kf" (Kalman Filter) or "dr" (Dead Reckoning)
  wheel_radius: 0.016     # estimator's wheel_radius [m]
  base_diameter: 0.0842   # estimator's base_diameter [m]
  noise_pos: 0.002        # position measurement noise [m] (from mocap almost no noise)
  noise_angle: 0.035      # orientation noise [rad] ~  2 degrees
  enc_angle_noise: 0.01   # 2 degrees encoder noise
  wheel_lp_tau: 0.053     # [s] first-order low-pass on encoder wheel speeds fed to the controller (mirrors firmware; ~30 ms lag). 0 disables.

  proc_pos_std: 0.02      # [m]   process noise on x,y per step
  proc_theta_std: 0.05    # [rad] process noise on θ per step

  start: [0.0, 0.0, 0.0]  # initial pose estimate
