sim_time: 5.0 # seconds
geometry_controller_dt: 0.05 # seconds
wheel_controller_dt: 0.01 # seconds
environment:
  min: [-1.5, -2.5]
  max: [1.5, 2.5]
  obstacles: []
start: [-0.5, -1.5]
goal:  [0.5, 1.5]
planner: 
  waypoints:
    - [0.5,0.0, -1.57]
    - [1.0,0.5, 1.57]
  time: 5.0 # seconds
controller:
  gains: [4.5, 6.0, 12.0, 2.5, 5.0, 0.0] # [kx, ky, kth, kpmotor, kimotor, kdmotor]
  # gains: [ 5.0, 5.0, 3.5, 5.0, 0.0, 0.0 ] # [kx, ky, kth, kpmotor, kimotor, kdmotor]
robot:
  type: differential_drive
  wheel_radius: 0.016   # m
  base_diameter: 0.0842 # m, *effective* wheelbase (absorbs tire scrub in turns, Borenstein & Feng 1996; may differ from geometric)
  max_wheel_speed: 250 # rad/s
  time_constant:  0.18  # time constant for first-order wheel dynamics (set to 0 for ideal actuation)
  # Slip model (see src/wmr_simulator/slip.py for formulas and references)
  a_slip_max: 0.0     # traction limit ~ mu*g in m/s^2, 0 disables (burnout model, Wong 2008)
  b_backlash: 0.0   # gear play half-width at wheel output in rad (~2 deg), 0 disables (Nordin & Gutman 2002)
  slip_sigma: 0.0     # stationary std of AR(1) fractional wheel slip (Gauss-Markov, Maybeck 1979)
  slip_tau: 0.0       # correlation time of AR(1) wheel slip in s
  v_max: 2.0          # m/s
  a_max: 3.0         # m/s^2
  a_max_lateral: 8.0 # m/s^2
  omega_max: 10.0    # rad/s
  alpha_max: 5.0    # rad/s^2

estimator:
  type: "kf"             # estimator type: "kf" (Kalman Filter) or "dr" (Dead Reckoning)
  wheel_radius: 0.016    # estimator's wheel_radius [m]
  base_diameter: 0.0842  # estimator's base_diameter [m]
  noise_pos: 0.0         # position measurement noise [m] (from mocap almost no noise)
  noise_angle: 0.0       # orientation noise [rad] ~  4 degrees
  enc_angle_noise: 0.0   # encoder noise
  
  proc_pos_std: 0.02      # [m]   process noise on x,y per step
  proc_theta_std: 0.05     # [rad] process noise on θ per step

  start: [0.0, 0.0, 0.0]  # initial pose estimate
