
[project]
name = "wmr-simulator"
version = "0.1.0"
description = "Add description"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "matplotlib==3.10.7",
    "meshcat==0.3.2",
    "numpy==2.3.5",
    "pyyaml>=6.0.3",
    "moviepy>=2.2.1",
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
    "hydra-core",
    "jax==0.9.2",
    "optax==0.2.8",
    "jax-tqdm>=0.4.0",
    "pyqt6>=6.11.0",
    "scipy>=1.16.3",
    "equinox>=0.13.8",
]

[dependency-groups]
dev = [
    "optimistix>=0.1.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
