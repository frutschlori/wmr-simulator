
[project]
name = "wmr-simulator"
version = "0.1.0"
description = "Differentiable simulator and active-learning pipeline for tuning the controller of a differential-drive robot"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "matplotlib==3.10.7",
    "meshcat==0.3.2",
    "numpy==2.3.5",
    "pyyaml>=6.0.3",
    "jax==0.9.2",
    "optax==0.2.8",
    "jax-tqdm>=0.4.0",
    "scipy>=1.16.3",
    "equinox>=0.13.8",
    "cvxpy>=1.7.4",
    "optimistix>=0.1.0",
    "mujoco>=3.2",
    # Deployment videos.
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "pillow>=10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
