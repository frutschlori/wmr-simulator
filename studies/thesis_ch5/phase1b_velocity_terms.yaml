# Phase 1b (2026-10-03): the velocity-tracking terms against the start offsets.
# The stock gains beat every v6 controller on the slow shapes; in MuJoCo the
# stock kx (4.5 vs the tuned ~2.1) closes most of that gap. The JAX plant
# prefers kx 4.5 on all six benchmark shapes as well, but the tuning objective
# rejects it: driving out the designed start offsets (mean 17 cm) at high kx
# doubles the linear-velocity term, because the controller has to leave the
# reference velocity to get back on track. Arms: the frozen unit weights, the
# linear-velocity term off, both velocity terms off. input_delta (duty
# changes) stays at 1 in every arm and is what prices oscillation.
# Code 60fae93 (arc turns, iteration 0 on the prior model), run from a frozen
# snapshot of it. S-A-R only (the main configuration), gain parametrization off.
phase: phase1b_velocity_terms
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 1.0
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-A-R: {tag: S-A-R}
  S-A-R_vlin0:
    tag: S-A-R
    overrides:
      gain_tuning: {linear_velocity_tracking_weight: 0.0}
  S-A-R_v0:
    tag: S-A-R
    overrides:
      gain_tuning: {linear_velocity_tracking_weight: 0.0, angular_velocity_tracking_weight: 0.0}
  stock: {baseline_gains: [4.5, 6.0, 12.0, 2.5, 5.0, 0.0]}
