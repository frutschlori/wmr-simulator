# Phase 2 rerun v3 (2026-10-01): encoder smoothing window 21 (v2 broke the R
# configurations, see STUDY_LOG). New encoder alignment, identification window 10,
# F level = random identification draw per seed. Frozen tuner (BFGS + unit weights,
# confirmed after the Phase 1 rerun). Originally: static matrix, decided
# 2026-10-01 after Phase 1). Gain parametrization off in every run; state-
# dependent gains are tuned post hoc on these runs later (Phase 3/4).
phase: phase2_static_v3
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 1.0
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-F-N: {tag: S-F-N}
  S-A-N: {tag: S-A-N}
  S-F-R: {tag: S-F-R}
  S-A-R: {tag: S-A-R}
  # Designed identification, fixed (matched) tuning set: separates the two
  # design problems (RQ3).
  S-AF-N: {tag: S-AF-N}
  # Optional extra: designed identification, random B-spline tuning set (the
  # designer's curve family without the FIM), isolates the FIM at an equal
  # curve family.
  S-AF-N_random15:
    tag: S-AF-N
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N15
  # Hand-tuned reference outside the matrix: the stock firmware gains on the
  # same paired benchmark seeds as every iteration of the tuned runs.
  stock: {baseline_gains: [4.5, 6.0, 12.0, 2.5, 5.0, 0.0]}
