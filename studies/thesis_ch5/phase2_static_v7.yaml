# Phase 2 v7 (2026-10-03): the static matrix on the current pipeline: v6 plus
# iteration 0 (tuning on the prior model before the first identification run),
# forward arc turns in the extended identification reference (commits 3cd5f35,
# 60fae93), and the linear-velocity tracking weight chosen by the Phase 1c sweep
# (0.25; Phase 1b: the full weight held kx down against the designed start
# offsets; Phase 1c: 0 and 0.1 diverged, 0.25 best of the rest).
# Otherwise the frozen tuner of v3-v6; gain parametrization off in every run.
phase: phase2_static_v7
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 0.25
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-F-N: {tag: S-F-N}
  S-A-N: {tag: S-A-N}
  S-F-R: {tag: S-F-R}
  S-A-R: {tag: S-A-R}
  # Designed identification, fixed (matched) tuning set: separates the two
  # design problems (RQ3).
  S-AF-N: {tag: S-AF-N}
  # Sample efficiency: random tuning sets from the designer's curve family.
  S-AF-N_random15:
    tag: S-AF-N
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N15
  S-AF-N_random45:
    tag: S-AF-N
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N45
  S-AF-N_random150:
    tag: S-AF-N
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N150
  # Hand-tuned reference outside the matrix: the stock firmware gains on the
  # same paired benchmark seeds as every iteration of the tuned runs.
  stock: {baseline_gains: [4.5, 6.0, 12.0, 2.5, 5.0, 0.0]}
