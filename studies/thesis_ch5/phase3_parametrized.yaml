# Phase 3 (2026-10-01): can the state-dependent controller (D) be made stable?
# Tuned post hoc (active_learning.posthoc) on copies of the Phase 2 v3 S-A-N
# runs: same identified models, tuning sets and benchmark seeds as the static
# controller, so D vs S is the parametrization alone. One change at a time
# against the frozen tuner (BFGS, unit weights, gain_delta 0).
phase: phase3_parametrized
source_phase: phase2_static_v3
iterations: 3
seeds: [0, 1, 2]
configurations:
  # The current method: error MLP on all 7 features, frozen tuner.
  D-base:
    source: S-A-N
    variants:
      base: {}
  # H1, trust region: July's LHS (+/-30 % band after iteration 1) + 3 Adam
  # starts at lr 1e-4, box 40 -- limits how far the MLP and base gains move
  # per iteration.
  D-h1-trust-region:
    source: S-A-N
    variants:
      h1:
        gain_tuning:
          optimizer: adam
          steps: 500
          learning_rate: 1.0e-4
          num_lhs_points: 500
          num_adam_optimizations: 3
          presearch_relative_range: 0.3
          k_max_stab: 40.0
  # H2, speed schedule: the five error features muted (feature scale 1000; a
  # 5 cm error becomes 5e-5), so the network schedules all five gains on the
  # reference speed v_d and |omega_d| only, like July's working MLP. Same
  # network and firmware format.
  D-h2-speed-schedule:
    source: S-A-N
    variants:
      h2:
        gain_parametrization:
          feature_scale: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 2.5, 10.0]
  # H4 check: gain_delta_weight 1 instead of 0 (prices fast factor changes).
  D-h4-gain-delta:
    source: S-A-N
    variants:
      h4:
        gain_tuning:
          gain_delta_weight: 1.0
  # H3, base gains held at static: each iteration's base gains are that
  # iteration's static result and stay frozen; only the network is trained
  # (warm-started across iterations). D = static controller x schedule, so the
  # network cannot undo runaway base gains -- there are none.
  D-h3-static-base:
    source: S-A-N
    variants:
      h3:
        base_from_static: true
