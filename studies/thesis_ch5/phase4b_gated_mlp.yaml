# Phase 4b (2026-10-03): the gain MLP behind an out-of-distribution gate
# (error_mlp.gate: k-means centers on the features the tuning rollouts visit,
# the network's output fades to 0 -- the static controller -- away from them).
# Otherwise exactly Phase 4 v6's H3 (static base gains x learned schedule),
# post hoc on the same Phase 2 v6 static runs and paired benchmark seeds, so
# h3_gate compares directly with phase4_parametrized_matrix_v6's h3.
phase: phase4b_gated_mlp
source_phase: phase2_static_v6
iterations: 5
seeds: [0, 1, 2, 3, 4]
configurations:
  D-F-N:
    source: S-F-N
    variants: {h3_gate: {base_from_static: true, gain_parametrization: {gate_num_centers: 8}}}
  D-A-N:
    source: S-A-N
    variants: {h3_gate: {base_from_static: true, gain_parametrization: {gate_num_centers: 8}}}
  D-F-R:
    source: S-F-R
    variants: {h3_gate: {base_from_static: true, gain_parametrization: {gate_num_centers: 8}}}
  D-A-R:
    source: S-A-R
    variants: {h3_gate: {base_from_static: true, gain_parametrization: {gate_num_centers: 8}}}
