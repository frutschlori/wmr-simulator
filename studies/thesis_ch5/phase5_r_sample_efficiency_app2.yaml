# Phase 5a (2026-10-03 night): the sample-efficiency arms with the residual on.
# The identification reference appends the previous tuning set's representative
# trajectories (2, the package default at 1f32934), so with R the residual is
# trained on whichever set the configuration tunes on: designed (S-A-R, from
# phase2_static_v8, same code and seeds) vs matched fixed vs random 15/45/150.
# Everything else as phase2_static_v8.
phase: phase5_r_sample_efficiency_app2
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 0.25
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-AF-R: {tag: S-AF-R}
  S-AF-R_random15:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N15
  S-AF-R_random45:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N45
  S-AF-R_random150:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N150
