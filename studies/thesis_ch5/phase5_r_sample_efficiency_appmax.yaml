# Phase 5b (2026-10-03 night): as phase5_r_sample_efficiency_app2, but the
# identification reference appends as many representative trajectories of the
# previous tuning set as fit the firmware's 500 points (up to 4: in practice 3,
# sometimes 4), and the designed configuration S-A-R runs here too.
phase: phase5_r_sample_efficiency_appmax
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  identification_trajectory: {append_tuning_trajectories: 4}
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 0.25
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-A-R: {tag: S-A-R}
  S-AF-R: {tag: S-AF-R}
  S-AF-R_random15:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N15
  S-AF-R_random45:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N45
  S-AF-R_random150:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N150
