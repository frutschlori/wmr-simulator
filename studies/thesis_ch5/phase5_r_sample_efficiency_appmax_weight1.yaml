# Phase 5c (2026-10-04 night): Phase 5b (append up to 4, R sample-efficiency
# arms) with unit tuning weights (linear_velocity_tracking_weight 1.0 instead of
# 0.25): does the designed set's lead at R survive the all-unit objective?
phase: phase5_r_sample_efficiency_appmax_weight1
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  identification_trajectory: {append_tuning_trajectories: 4}
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 1.0
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-A-R: {tag: S-A-R}
  S-AF-R: {tag: S-AF-R}
  S-AF-R_random15:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N15
  S-AF-R_random45:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N45
  S-AF-R_random150:
    tag: S-AF-R
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N150
