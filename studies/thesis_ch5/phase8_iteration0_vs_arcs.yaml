# Phase 8 (2026-10-04 night): the open v6 -> v7 question from the 2026-10-03 HANDOFF. v8 code
# (1f32934) with prior_tuning false, no wrong initial model and linear-velocity weight 1 = v6
# plus forward arc turns. If the designed set's N-side edge over random sets comes back to v6's
# size, iteration 0 caused the shrink; if not, the arc turns did. Compare with phase2_static_v6.
phase: phase8_iteration0_vs_arcs
iterations: 5
seeds: [0, 1, 2, 3, 4]
overrides:
  benchmark: {max_workers: 4}
  prior_tuning: false
  initial_robot_params: null
  gain_tuning: &frozen_tuner
    optimizer: bfgs
    steps: 160
    num_lhs_points: 0
    k_max_stab: 20.0
    position_tracking_weight: 1.0
    heading_tracking_weight: 1.0
    linear_velocity_tracking_weight: 1.0
    angular_velocity_tracking_weight: 1.0
    input_weight: 0.0
    input_delta_weight: 1.0
    omega_delta_weight: 0.0
    gain_delta_weight: 0.0
configurations:
  S-A-N: {tag: S-A-N}
  S-AF-N: {tag: S-AF-N}
  S-AF-N_random15:
    tag: S-AF-N
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N15
  S-AF-N_random150:
    tag: S-AF-N
    overrides:
      baseline_tuning_trajectories_dir: trajectory_exports/fixed_sets/random_bspline_N150
